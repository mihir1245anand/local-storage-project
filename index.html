<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive To-Do List</title>
  <meta name="description" content="A clean, modern, and interactive To-Do List with LocalStorage persistence, filtering, and live counter built with pure vanilla HTML, CSS, and JavaScript.">
  
  <!-- Google Fonts for Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient Background Accents -->
  <div class="bg-glow bg-glow-1" aria-hidden="true"></div>
  <div class="bg-glow bg-glow-2" aria-hidden="true"></div>

  <!-- Main Application Container -->
  <main class="app-card" role="main">
    <!-- Header Section -->
    <header class="app-header">
      <div class="header-title-group">
        <div class="app-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"></path>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
        </div>
        <div>
          <h1>Task Master</h1>
          <p class="subtitle">Stay focused, organized, and productive</p>
        </div>
      </div>
    </header>

    <!-- Task Input Form -->
    <section class="input-section" aria-label="Add a new task">
      <form id="todoForm" class="todo-form" onsubmit="return false;">
        <div class="input-wrapper">
          <input 
            type="text" 
            id="taskInput" 
            class="task-input" 
            placeholder="What needs to be done? (Press Enter)" 
            aria-label="New task input"
            autocomplete="off"
            maxlength="120"
          >
        </div>
        <button type="submit" id="addBtn" class="btn-add" aria-label="Add task">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Add</span>
        </button>
      </form>
    </section>

      </main>
</body>
</html>
